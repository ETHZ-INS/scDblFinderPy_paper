# Scrublet (via scanpy's sc.pp.scrublet) and pyscdblfinder
# (https://github.com/omicverse/py-scDblFinder). Kept separate from the env
# that runs scDblFinderPy, whose own pins (e.g. scanpy==1.12.1) would
# otherwise hold these at older versions. Every pip package is pinned
# (full `pip freeze` of the env the benchmark was run with).
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13.14
  - pip
  - pip:
      - anndata==0.13.4
      - annotated-types==0.8.0
      - array-api-compat==1.15.0
