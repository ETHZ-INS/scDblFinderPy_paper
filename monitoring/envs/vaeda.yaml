# Vaeda (https://github.com/kostkalab/vaeda) needs Python 3.8 and
# TensorFlow 2.8, which conflict with every other env in this pipeline.
# Every pip package is pinned (full `pip freeze` of the env the benchmark
# was run with). vaeda itself is only published on TestPyPI, so it's
# installed separately by vaeda.post-deploy.sh (with --no-deps, so nothing
# else is ever resolved from TestPyPI).
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.8.20
  - pip=24.3.1
  - setuptools=75.3.0
  - wheel=0.45.1
